<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="icon" type="image/svg+xml" href="/assets/public/favicon/favicon.svg">
          <link rel="stylesheet" href="/style.css">
          <link rel="stylesheet" href="/chatbot.css">
          <title>Website Design & Growth Strategy for Service Businesses | Goldline</title>
          <meta name="description" content="A connected approach to website design and growth strategy for service businesses, built to align positioning, design, and execution into one continuous process.">
     </head>
     <body>
         
          <div id="chatbot-container" class="cu fc je open">
               <div class="background-cover cu"></div>
               <div class="tab-wrap fr g16">
                    <button class="tab active">Chat</button>
                    <button class="tab mra">Book A Call</button>
                    <button class="close fr jc">
                         <img src="/assets/cross.svg" decoding="async" loading="lazy" />
                    </button>
               </div>
               <div class="flex message-container">
                    <div class="message-wrap cu fc g28 flex">
                    </div>
                    <div class="video-wrap">
                         <div class="border"></div>
                         <video
                              src="/assets/mobina-v.webm"
                              autoplay
                              muted
                              loop
                              playsinline
                              preload="none"
                         ></video>
                         <div class="gradient cu fs"></div>
                    </div>
                    <div class="starter-wrap fs je fc">
                         <span class="name">Mobina</span>
                         <p>Hey, Im Mobina, Goldline’s AI assistant. <br>What are you looking for?</p>
                         <div class="fr g8">
                              <button class="prompt">I have a project</button>
                              <button class="prompt">What do you’se do?</button>
                              <button class="prompt">Am i a fit?</button>
                         </div>
                    </div>
               </div>
               <div class="input-wrap cu fr as">
                    <div id="chatWidgetOrb" class="chat-orb fr jc">
                         <svg width="22" height="22" viewBox="0 0 40 40" fill="currentColor">
                              <g class="inner-ring"></g>
                              <g class="outer-ring"></g>
                         </svg>
                    </div>
                    <div class="input-container fr">
                         <input type="text" class="flex" placeholder="Ask me anything...">
                    </div>
               </div>
          </div>




          <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
const container = document.getElementById('chatbot-container');
const orb = document.querySelector('#chatWidgetOrb');
const closeButton = container.querySelector('.tab-wrap .close');

const innerRing = orb.querySelector('.inner-ring');
const outerRing = orb.querySelector('.outer-ring');

let isOpen = container.classList.contains('open');
let breathingTl = null;
let transitionTl = null;
let thinkingTl = null;

/* build dots */

const innerDots = Array.from({ length: 4 }, (_, i) => {
     const angle = (i / 4) * Math.PI * 2 - Math.PI / 2;

     return {
          cx: 20 + Math.cos(angle) * 5,
          cy: 20 + Math.sin(angle) * 5
     };
});

const outerDots = Array.from({ length: 10 }, (_, i) => {
     const angle = (i / 10) * Math.PI * 2 - Math.PI / 2;

     return {
          cx: 20 + Math.cos(angle) * 12,
          cy: 20 + Math.sin(angle) * 12
     };
});

innerRing.innerHTML = innerDots
     .map(dot => `<circle cx="${dot.cx}" cy="${dot.cy}" r="1.75"></circle>`)
     .join('');

outerRing.innerHTML = outerDots
     .map(dot => `<circle cx="${dot.cx}" cy="${dot.cy}" r="1.75"></circle>`)
     .join('');

const innerCircles = Array.from(innerRing.querySelectorAll('circle'));
const outerCircles = Array.from(outerRing.querySelectorAll('circle'));

/* settings */

const innerRadius = {
     min: 4.5,
     max: 5.5
};

const outerRadius = {
     min: 10.8,
     max: 13.2
};

/* helpers */

function killAll() {
     breathingTl?.kill();
     transitionTl?.kill();
     thinkingTl?.kill();
     thinkingTl = null;

     gsap.killTweensOf([
          innerRing,
          outerRing,
          ...innerCircles,
          ...outerCircles
     ]);
}

function buildBreathingTl() {
     const tl = gsap.timeline({
          repeat: -1,
          yoyo: true
     });

     innerCircles.forEach((circle, i) => {
          const angle = (i / 4) * Math.PI * 2 - Math.PI / 2;

          tl.fromTo(circle,
               {
                    attr: {
                         cx: 20 + Math.cos(angle) * innerRadius.min,
                         cy: 20 + Math.sin(angle) * innerRadius.min
                    }
               },
               {
                    attr: {
                         cx: 20 + Math.cos(angle) * innerRadius.max,
                         cy: 20 + Math.sin(angle) * innerRadius.max
                    },
                    duration: 2,
                    ease: 'sine.inOut'
               },
               0
          );
     });

     outerCircles.forEach((circle, i) => {
          const angle = (i / 10) * Math.PI * 2 - Math.PI / 2;

          tl.fromTo(circle,
               {
                    attr: {
                         cx: 20 + Math.cos(angle) * outerRadius.min,
                         cy: 20 + Math.sin(angle) * outerRadius.min
                    }
               },
               {
                    attr: {
                         cx: 20 + Math.cos(angle) * outerRadius.max,
                         cy: 20 + Math.sin(angle) * outerRadius.max
                    },
                    duration: 2,
                    ease: 'sine.inOut'
               },
               0
          );
     });

     return tl;
}

function startBreathing() {
     if (thinkingTl) return;
     breathingTl = buildBreathingTl();
}

function startThinkingOrb() {
     killAll();

     thinkingTl = gsap.timeline({
          repeat: -1
     });

     thinkingTl
          .to(innerRing, {
               rotation: '+=360',
               svgOrigin: '20 20',
               duration: 5.5,
               ease: 'none'
          }, 0)
          .to(outerRing, {
               rotation: '-=360',
               svgOrigin: '20 20',
               duration: 8,
               ease: 'none'
          }, 0);
}

function stopThinkingOrb() {
     if (!thinkingTl) return;

     thinkingTl.kill();
     thinkingTl = null;

     gsap.set(innerRing, {
          rotation: 0,
          svgOrigin: '20 20'
     });

     gsap.set(outerRing, {
          rotation: 0,
          svgOrigin: '20 20'
     });

     startBreathing();
}

function animateDotsOut(circles, stagger) {
     const tl = gsap.timeline();

     circles.forEach((circle, i) => {
          tl.to(circle, {
               opacity: 0.3,
               duration: 0.3,
               ease: 'sine.inOut'
          }, i * stagger);

          tl.to(circle, {
               opacity: 1,
               duration: 0.3,
               ease: 'sine.inOut'
          }, i * stagger + 0.3);
     });

     return tl;
}

function activateOrb() {
     killAll();

     transitionTl = gsap.timeline();

     transitionTl
          .fromTo(innerRing,
               { rotation: 0 },
               {
                    rotation: 180,
                    svgOrigin: '20 20',
                    duration: 0.5,
                    ease: 'power2.inOut'
               },
               0
          )
          .fromTo(outerRing,
               { rotation: 0 },
               {
                    rotation: -72,
                    svgOrigin: '20 20',
                    duration: 0.5,
                    ease: 'power2.inOut'
               },
               0
          );

     animateDotsOut(innerCircles, 0.15);
     animateDotsOut([...outerCircles].reverse(), 0.09);
}

function deactivateOrb() {
     killAll();

     transitionTl = gsap.timeline({
          onComplete: startBreathing
     });

     transitionTl
          .to(innerRing, {
               rotation: 0,
               svgOrigin: '20 20',
               duration: 0.5,
               ease: 'power2.inOut'
          }, 0)
          .to(outerRing, {
               rotation: 0,
               svgOrigin: '20 20',
               duration: 0.5,
               ease: 'power2.inOut'
          }, 0);

     animateDotsOut([...innerCircles].reverse(), 0.15);
     animateDotsOut(outerCircles, 0.09);
}

/* open / close */

function openWidget() {
     if (isOpen) return;

     isOpen = true;

     container.classList.remove('closing', 'closed');
     container.classList.add('open');

     activateOrb();
}

function closeWidget() {
     if (!isOpen) return;

     isOpen = false;

     container.classList.add('closing');

     deactivateOrb();

     requestAnimationFrame(() => {
          container.classList.remove('open');
     });

     setTimeout(() => {
          container.classList.remove('closing');
          container.classList.add('closed');
     }, 400);
}

/* init */

startBreathing();

window.chatbotOrbControls = {
     startThinkingOrb,
     stopThinkingOrb
};

orb.addEventListener('click', event => {
     event.stopPropagation();

     if (!isOpen) {
          openWidget();
     }
});

closeButton.addEventListener('click', event => {
     event.stopPropagation();
     closeWidget();
});

document.addEventListener('click', event => {
     if (!isOpen || container.contains(event.target)) {
          return;
     }

     closeWidget();
});
</script>
          <script src="/chat-widget.js" defer></script>
     </body>
</html>
